[project]
name = "benjamin-csg-ha-maintenance"
version = "1.3.1"
requires-python = ">=3.12"
dependencies = [
  "brotli",
  "pycryptodome",
  "requests",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I"]
